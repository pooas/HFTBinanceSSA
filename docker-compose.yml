services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: hft_clickhouse
    ports:
      - "8123:8123" 
      - "9000:9000"
    environment:
      - CLICKHOUSE_PASSWORD=hft123
    volumes:
      # این ولوم‌ها باید اینجا (زیر کلیک‌هاوس) باشند، نه گرافانا!
      - ./ch-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - hft-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hft_grafana
    ports:
      - "3000:3000"
      # پورت 8123 از اینجا حذف شد تا با کلیک‌هاوس تداخل نکند
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana  # اضافه شدن ولوم برای ذخیره تنظیمات خود گرافانا
    environment:
      # از آنجایی که سرور آلمان/ژاپن است، تحریم نیستید و پلاگین راحت و خودکار دانلود می‌شود
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_PLUGINS_ALLOW_UNSIGNED_PLUGINS=grafana-clickhouse-datasource
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=500ms
      - GF_DASHBOARDS_AUTO_REFRESH_INTERVALS=500ms,1s,2s,5s,10s,30s
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - hft-net

  java-app:
    build:
      context: ./java-app
      dockerfile: Dockerfile
    container_name: hft_java_producer
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - hft-net

networks:
  hft-net:
    driver: bridge

# تعریف نام ولوم‌ها در انتهای فایل الزامی است
volumes:
  clickhouse_data:
  grafana_data: