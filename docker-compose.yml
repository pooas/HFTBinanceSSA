services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: hft_clickhouse
    network_mode: "host"
    environment:
      - CLICKHOUSE_PASSWORD=hft123
    volumes:
      - ./ch-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hft_grafana
    network_mode: "host"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/plugins:/var/lib/grafana/plugins
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_PLUGINS_ALLOW_UNSIGNED_PLUGINS=grafana-clickhouse-datasource
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=500ms
      - GF_DASHBOARDS_AUTO_REFRESH_INTERVALS=500ms,1s,2s,5s,10s,30s
    depends_on:
      clickhouse:
        condition: service_healthy

  cpp-hmm:
    build:
      context: .
      network: host
      dockerfile: Dockerfile.cpp-consolidated
      target: hmm-runtime
    container_name: hft_cpp_hmm
    network_mode: "host"
    environment:
      - ZMQ_PORT=5555

  cpp-sg-dsp:
    build:
      context: .
      network: host
      dockerfile: Dockerfile.cpp-consolidated
      target: sg-runtime
    container_name: hft_cpp_sg_dsp
    network_mode: "host"
    environment:
      - CLICKHOUSE_HOST=127.0.0.1
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=hft123
      - SG_ZMQ_PORT=5557
      - SG_POLL_INTERVAL_MS=50
      - SG_WARMUP_ROWS=500
    depends_on:
      clickhouse:
        condition: service_healthy

  cpp-ssa:
    build:
      context: .
      network: host
      dockerfile: Dockerfile.cpp-consolidated
      target: ssa-runtime
    container_name: hft_cpp_ssa
    network_mode: "host"
    environment:
      - CLICKHOUSE_HOST=127.0.0.1
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=hft123
      - HMM_ZMQ_HOST=127.0.0.1
      - HMM_ZMQ_PORT=5555
      - SSA_ZMQ_PORT=5558
      - SSA_POLL_INTERVAL_MS=50
      - SSA_WARMUP_ROWS=500
    depends_on:
      clickhouse:
        condition: service_healthy
      cpp-hmm:
        condition: service_started

  python-macro:
    build:
      context: ./python-macro
      network: host
      dockerfile: Dockerfile
    container_name: hft_python_macro
    network_mode: "host"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_MODE=${DATA_MODE:-LIVE}
      - CSV_PATH=${CSV_PATH:-/data/ticks.csv}
      - BINANCE_REST_URL=${BINANCE_REST_URL:-https://api.binance.com}
      - BINANCE_KLINE_WS_URL=${BINANCE_KLINE_WS_URL:-wss://stream.binance.com:9443/ws/btcusdt@kline_1m}
    volumes:
      - ./tests/data/hft_tick_data_sample.csv:/data/ticks.csv:ro

  java-app:
    build:
      context: ./java-app
      network: host
      dockerfile: Dockerfile
    container_name: hft_java_producer
    network_mode: "host"
    restart: unless-stopped
    environment:
      - CLICKHOUSE_HOST=127.0.0.1
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=hft123
      - DATA_MODE=${DATA_MODE:-LIVE}
      - BINANCE_AGGTRADE_WS_URL=${BINANCE_AGGTRADE_WS_URL:-wss://stream.binance.com:9443/ws/btcusdt@aggTrade}
      - ZMQ_HOST=127.0.0.1
      - ZMQ_PORT=5555
      - MACRO_ZMQ_HOST=127.0.0.1
      - MACRO_ZMQ_PORT=5556
      - SG_ZMQ_HOST=127.0.0.1
      - SG_ZMQ_PORT=5557
      - SSA_ZMQ_HOST=127.0.0.1
      - SSA_ZMQ_PORT=5558
    depends_on:
      clickhouse:
        condition: service_healthy
      cpp-hmm:
        condition: service_started
      cpp-sg-dsp:
        condition: service_started
      cpp-ssa:
        condition: service_started

  replay-mock:
    build:
      context: ./replay-mock
      network: host
      dockerfile: Dockerfile
    container_name: hft_replay_mock
    network_mode: "host"
    profiles:
      - replay
    volumes:
      - ./tests/data/hft_tick_data_sample.csv:/data/ticks.csv:ro
    environment:
      - CSV_PATH=/data/ticks.csv
      - MOCK_PORT=8080
      - REPLAY_SPEED=${REPLAY_SPEED:-0}
      - REPLAY_LOOP=${REPLAY_LOOP:-false}

volumes:
  clickhouse_data:
  grafana_data:
