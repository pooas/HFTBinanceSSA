services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: hft_clickhouse
    ports:
      - "8123:8123" 
      - "9000:9000"
    environment:
      - CLICKHOUSE_PASSWORD=hft123
    volumes:
      # این ولوم‌ها باید اینجا (زیر کلیک‌هاوس) باشند، نه گرافانا!
      - ./ch-init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - hft-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:latest
    container_name: hft_grafana
    ports:
      - "3000:3000"
      # پورت 8123 از اینجا حذف شد تا با کلیک‌هاوس تداخل نکند
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana  # اضافه شدن ولوم برای ذخیره تنظیمات خود گرافانا
    environment:
      # از آنجایی که سرور آلمان/ژاپن است، تحریم نیستید و پلاگین راحت و خودکار دانلود می‌شود
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_PLUGINS_ALLOW_UNSIGNED_PLUGINS=grafana-clickhouse-datasource
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=500ms
      - GF_DASHBOARDS_AUTO_REFRESH_INTERVALS=500ms,1s,2s,5s,10s,30s
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - hft-net

  # 🌟 سرویس جدید C++ (مغز متفکر HMM)
  cpp-hmm:
    build:
      context: .
      dockerfile: Dockerfile.cpp-consolidated
      target: hmm-runtime
    container_name: hft_cpp_hmm
    environment:
      - ZMQ_PORT=5555
    networks:
      - hft-net

  cpp-sg-dsp:
    build:
      context: .
      dockerfile: Dockerfile.cpp-consolidated
      target: sg-runtime
    container_name: hft_cpp_sg_dsp
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=hft123
      - SG_ZMQ_PORT=5557
      - SG_POLL_INTERVAL_MS=50
      - SG_WARMUP_ROWS=500
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - hft-net

  cpp-ssa:
    build:
      context: .
      dockerfile: Dockerfile.cpp-consolidated
      target: ssa-runtime
    container_name: hft_cpp_ssa
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=hft123
      - HMM_ZMQ_HOST=cpp-hmm
      - HMM_ZMQ_PORT=5555
      - SSA_ZMQ_PORT=5558
      - SSA_POLL_INTERVAL_MS=50
      - SSA_WARMUP_ROWS=500
    depends_on:
      clickhouse:
        condition: service_healthy
      cpp-hmm:
        condition: service_started
    networks:
      - hft-net

  # 🌟 سرویس جدید فرمانده: Python Macro Engine
  python-macro:
    build:
      context: ./python-macro
      dockerfile: Dockerfile
    container_name: hft_python_macro
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5556:5556"
    networks:
      - hft-net
  java-app:
    build:
      context: ./java-app
      dockerfile: Dockerfile
    container_name: hft_java_producer
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=hft123
      - ZMQ_HOST=cpp-hmm
      - ZMQ_PORT=5555
      - MACRO_ZMQ_HOST=python-macro
      - MACRO_ZMQ_PORT=5556
      - SG_ZMQ_HOST=cpp-sg-dsp
      - SG_ZMQ_PORT=5557
      - SSA_ZMQ_HOST=cpp-ssa
      - SSA_ZMQ_PORT=5558
    depends_on:
      clickhouse:
        condition: service_healthy
      cpp-hmm:
        condition: service_started
      cpp-sg-dsp:
        condition: service_started
      cpp-ssa:
        condition: service_started
    networks:
      - hft-net

networks:
  hft-net:
    driver: bridge

# تعریف نام ولوم‌ها در انتهای فایل الزامی است
volumes:
  clickhouse_data:
  grafana_data: